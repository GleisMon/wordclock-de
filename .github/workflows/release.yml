name: build & release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

env:
  FQBN: esp8266:esp8266:nodemcuv2:eesz=4M1M,xtal=160,ip=lm2f,ssl=all

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version from version.h
        run: |
          V=$(sed -n 's/^#define FW_VERSION "\(.*\)"/\1/p' firmware/Wortuhr/version.h)
          echo "VERSION=$V" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/v* && "v$V" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version.h ($V)"; exit 1
          fi

      - uses: arduino/setup-arduino-cli@v2

      - name: Core and libraries (pinned)
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core update-index
          arduino-cli core install esp8266:esp8266@3.1.2
          arduino-cli lib install "NeoPixelBus by Makuna@2.8.4" "WiFiManager@2.0.17" "ArduinoJson@7.4.3"

      - name: Signing key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          test -n "$SIGNING_KEY" || { echo "::error::secret SIGNING_KEY missing"; exit 1; }
          printf '%s\n' "$SIGNING_KEY" > firmware/Wortuhr/private.key

      - name: Build
        run: arduino-cli compile --fqbn "$FQBN" --output-dir build firmware/Wortuhr

      - name: Remove signing key
        if: always()
        run: rm -f firmware/Wortuhr/private.key

      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          test -f build/Wortuhr.ino.bin.signed
          mkdir dist
          cp build/Wortuhr.ino.bin.signed dist/wortuhr-de.bin
          printf '{"version":"%s"}\n' "$VERSION" > dist/version.json

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/wortuhr-de.bin
            dist/version.json
          generate_release_notes: true
